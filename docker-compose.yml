services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_user -d football_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://football_user:password@postgres:5432/football_ai
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - DATA_PROVIDER=${DATA_PROVIDER:-sportmonks}
      - SPORTMONKS_API_TOKEN=${SPORTMONKS_API_TOKEN:-}
      - CRON_SECRET=${CRON_SECRET:-change-me-cron-secret-minimum-32-characters}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_AUTO_START=false
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
